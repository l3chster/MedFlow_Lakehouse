resources:
  pipelines:
    hospital_ingestion_pipeline:
      name: hospital_ingestion_pipeline
      catalog: ${var.catalog_name}
      schema: ${resources.schemas.hospital_bronze.name}
      serverless: true
      root_path: ../hospital_ingestion_pipeline
      configuration:
        hospital.ingestion.catalog_name: ${var.catalog_name}
        hospital.ingestion.bronze_schema: ${resources.schemas.hospital_bronze.name}
        hospital.ingestion.silver_schema: ${resources.schemas.hospital_silver.name}
        hospital.ingestion.gold_schema: ${resources.schemas.hospital_gold.name}
      libraries:
        - glob:
            include: ../hospital_ingestion_pipeline/transformations/**
