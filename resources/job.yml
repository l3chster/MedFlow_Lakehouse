resources:
  jobs:
    hospital_ingest_and_refresh:
      name: hospital_ingest_and_refresh
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: bronze_schema
          default: ${resources.schemas.hospital_bronze.name}
        - name: silver_schema
          default: ${resources.schemas.hospital_silver.name}
        - name: gold_schema
          default: ${resources.schemas.hospital_gold.name}
        - name: workspace_url
          default: ${var.workspace_url}
        - name: zerobus_workspace_id
          default: ${var.zerobus_workspace_id}
        - name: zerobus_region
          default: ${var.zerobus_region}
        - name: csv_api_app_name
          default: ${var.csv_api_app_name}
        - name: csv_api_app_url
          default: ${var.csv_api_app_url}
      tasks:
        - task_key: external_table_connection
          environment_key: default
          notebook_task:
            notebook_path: ../EXTERNAL_TABLE_CONNECTION.py
        - task_key: zerobus_patients
          environment_key: default
          notebook_task:
            notebook_path: ../ZEROBUS_patients_ingest.py
        - task_key: governance
          environment_key: default
          notebook_task:
            notebook_path: ../GOVERNANCE.py
        - task_key: run_pipeline
          depends_on:
            - task_key: external_table_connection
            - task_key: zerobus_patients
            - task_key: governance
          pipeline_task:
            pipeline_id: ${resources.pipelines.hospital_ingestion_pipeline.id}
        - task_key: refresh_vector_index
          depends_on:
            - task_key: run_pipeline
          environment_key: default
          notebook_task:
            notebook_path: ../REFRESH_VECTOR_INDEX.py
            base_parameters:
              vector_search_endpoint: ${var.vector_search_endpoint}
              embedding_model: ${var.embedding_model}
              rag_app_name: ${var.rag_app_name}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - databricks-zerobus-ingest-sdk
              - databricks-sdk
              - requests
