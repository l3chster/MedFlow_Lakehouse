resources:
  apps:
    csv_api_app:
      name: ${var.csv_api_app_name}
      description: Streams hospital CSV rows for ZeroBus ingest
      source_code_path: ../csv-api-app_hospital
      resources:
        - name: state_volume
          description: Stream progress state
          uc_securable:
            securable_full_name: ${var.catalog_name}.${resources.schemas.hospital_bronze.name}.${resources.volumes.csv_api_state.name}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: streaming_volume
          description: Incoming CSV files
          uc_securable:
            securable_full_name: ${var.catalog_name}.${resources.schemas.hospital_bronze.name}.${resources.volumes.csv_streaming.name}
            securable_type: VOLUME
            permission: READ_VOLUME
    rag_assistant:
      name: ${var.rag_app_name}
      description: RAG assistant answering questions about ER operations
      source_code_path: ../rag_assistant_app
      resources:
        - name: chat_model
          description: LLM endpoint used to answer questions
          serving_endpoint:
            name: ${var.chat_model}
            permission: CAN_QUERY
      config:
        command: ["streamlit", "run", "app.py", "--server.port", "8001", "--server.address", "0.0.0.0"]
        env:
          - name: VECTOR_INDEX_NAME
            value: ${var.catalog_name}.${resources.schemas.hospital_gold.name}.rag_insight_index
          - name: CHAT_MODEL
            value: ${var.chat_model}
