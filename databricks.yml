bundle:
  name: hospital_emergency_databricks

include:
  - resources/*.yml

variables:  
  workspace_url:
    description: Workspace URL
  catalog_name:
    description: Unity Catalog for bronze/silver/gold tables
    default: dbr_dev
  zerobus_workspace_id:
    description: Numeric workspace id in the Zerobus ingest hostname
  zerobus_region:
    description: Cloud region segment in the Zerobus ingest hostname (Azure e.g. eastus, AWS e.g. us-east-2)
    default: eastus
  csv_api_app_name:
    description: Databricks App name that streams CSV rows
    default: csv-api-app
  csv_api_app_url:
    description: Full /api/stream URL of the CSV app
    default: "https://${var.csv_api_app_name}-${var.zerobus_workspace_id}.0.azure.databricksapps.com/api/stream"
  vector_search_endpoint:
    description: Vector Search endpoint hosting the RAG index
    default: hospital-rag-endpoint
  embedding_model:
    description: Embedding model endpoint for the vector index
    default: databricks-gte-large-en
  chat_model:
    description: Foundation Model serving endpoint used by the RAG app
    default: databricks-meta-llama-3-3-70b-instruct
  rag_app_name:
    description: Databricks App name of the RAG assistant
    default: rag-assistant

targets:
  dev:
    default: true
    mode: development
    # host comes from DATABRICKS_HOST (set in CI per environment)
    variables:
      # dev workspace is on AWS: <app>-<workspace_id>.aws.databricksapps.com
      csv_api_app_url: "https://${var.csv_api_app_name}-${var.zerobus_workspace_id}.aws.databricksapps.com/api/stream"

  prod:
    mode: production   
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      # check the app domain number (.0 / .1) in the PROD workspace
      csv_api_app_url: "https://${var.csv_api_app_name}-${var.zerobus_workspace_id}.0.azure.databricksapps.com/api/stream"
